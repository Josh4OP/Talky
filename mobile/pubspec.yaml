name: talky
description: "TALKY: retroalimentación de exposiciones orales para estudiantes universitarios."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  file_picker: ^13.2.0
  fl_chart: ^1.3.0
  record: ^6.2.1
  path_provider: ^2.1.6
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
  # Nunito (títulos y cifras) y Nunito Sans (texto), licencia OFL en assets/fonts/OFL-*.txt.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    # Fuente variable: el peso lo fija `fontVariations` en `AppText`.
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
